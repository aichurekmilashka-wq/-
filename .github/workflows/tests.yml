name: Checks
on: [push, pull_request]
defaults:
  run:
    working-directory: Worktime Tracker
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -v
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node scripts/syntax-check.js
  react:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
  hosted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t worktime-demo .
      - run: docker run -d --name worktime-smoke -p 127.0.0.1:8766:10000 -e RENDER_EXTERNAL_URL=https://worktime-test.onrender.com worktime-demo
      - run: python3 scripts/smoke-hosted.py --base-url http://127.0.0.1:8766 --public-origin https://worktime-test.onrender.com
      - if: always()
        run: docker logs worktime-smoke
      - if: always()
        run: docker rm -f worktime-smoke
