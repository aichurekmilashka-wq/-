name: Live demo check
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/live-demo-check.yml
permissions:
  contents: read
jobs:
  live-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: Worktime Tracker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check published Render demo
        run: python3 scripts/smoke-hosted.py --base-url https://worktime-demo.onrender.com --public-origin https://worktime-demo.onrender.com
